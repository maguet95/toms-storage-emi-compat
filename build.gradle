plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
}

repositories {
	mavenCentral()
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Tom's Storage y PF-EMI solo para compilar: en el juego los aporta el modpack.
	modCompileOnly files('libs/toms_storage_fabric-1.21.11-2.8.0.jar')
	modCompileOnly files('libs/PF-EMI-1.21.11.jar')
}

// Variante para Living (./gradlew build -Pliving): la misma, más la traducción de Tom's al español DENTRO del jar.
// Así llega con el mod y no depende de que el launcher active un paquete de texturas. Para compartir, la normal.
def living = project.hasProperty('living')
if (living) {
	base.archivesName = 'toms-storage-emi-compat-living-traduccion-es'
}

processResources {
	if (living) {
		from('traduccion-es/pack/assets') { into 'assets' }
	}
	def version = project.version
	inputs.property "version", version
	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}
